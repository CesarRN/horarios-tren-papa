name: Actualizar horarios de tren

on:
  schedule:
    # Cada noche a las 03:15 UTC (~04:15/05:15 hora de España según horario)
    - cron: "15 3 * * *"
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar data/horarios.json
        run: python3 scripts/actualizar_horarios.py

      - name: Publicar cambios si hay horarios nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/horarios.json; then
            git add data/horarios.json
            git commit -m "Actualizar horarios ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Sin cambios en los horarios."
          fi
