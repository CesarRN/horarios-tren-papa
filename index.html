<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f6c">
<title>Horarios de tren</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --azul:#0b4f6c;
    --azul-claro:#1c7ea6;
    --verde:#1c7a4d;
    --texto:#12212b;
    --fondo:#f4f7f8;
    --tarjeta:#ffffff;
    --borde:#c9d6db;
    --foco:#e08a00;
    box-sizing:border-box;
  }
  *{box-sizing:inherit}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--fondo); color:var(--texto);
    font-family:-apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust:100%;
  }
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    padding:18px 16px 10px;
    text-align:center;
  }
  header h1{
    font-size:26px; margin:0 0 4px;
  }
  header .subtitulo{
    font-size:18px; color:#3a5560; margin:0;
  }
  main{
    max-width:640px; margin:0 auto; padding:8px 16px 40px;
  }
  .pantalla{ display:none; }
  .pantalla.activa{ display:block; }

  .opciones-grandes{
    display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px;
  }
  @media (max-width:420px){
    .opciones-grandes{ grid-template-columns:1fr; }
  }
  .opcion{
    background:var(--tarjeta); border:3px solid var(--borde); border-radius:20px;
    padding:26px 8px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; cursor:pointer; color:var(--texto);
    min-height:160px;
  }
  .opcion:active{ transform:scale(0.98); }
  .opcion:focus-visible{ outline:4px solid var(--foco); }
  .opcion.seleccionada{ border-color:var(--azul-claro); background:#eaf4f8; }
  .opcion svg{ width:60px; height:60px; }
  .opcion .fila-iconos{
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .opcion .flecha-direccion{ width:34px; height:34px; flex:0 0 auto; }

  .volver{
    display:inline-flex; align-items:center; justify-content:center;
    background:none; border:none; padding:10px; margin-bottom:4px; cursor:pointer;
  }
  .volver svg{ width:34px; height:34px; }
  .volver:focus-visible{ outline:3px solid var(--foco); border-radius:8px; }

  .carrusel-wrapper{ position:relative; margin:10px 0 16px; }
  .carrusel-dias{
    display:flex; gap:14px; overflow-x:auto; padding:10px 46px 16px;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
  }
  .flecha-scroll{
    position:absolute; top:0; bottom:16px; width:40px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; cursor:pointer; color:var(--azul-claro);
    z-index:2;
  }
  .flecha-scroll.izq{ left:0; }
  .flecha-scroll.der{ right:0; }
  .flecha-scroll svg{ width:26px; height:26px; }
  .flecha-scroll:focus-visible{ outline:4px solid var(--foco); border-radius:8px; }
  .dia{
    scroll-snap-align:center; flex:0 0 auto;
    background:var(--tarjeta); border:3px solid var(--borde); border-radius:18px;
    min-width:126px; padding:18px 8px; text-align:center; cursor:pointer;
  }
  .dia .mes{ font-size:20px; text-transform:uppercase; color:#3a5560; font-weight:600; }
  .dia .num{ font-size:56px; font-weight:700; line-height:1.05; }
  .dia .diasem{ font-size:20px; color:#3a5560; }
  .dia.seleccionado{ border-color:var(--azul-claro); background:#eaf4f8; }
  .dia:focus-visible{ outline:4px solid var(--foco); }

  .lista-trenes{ display:flex; flex-direction:column; gap:14px; margin-top:14px; }
  .tren{
    background:var(--tarjeta); border:3px solid var(--borde); border-radius:18px;
    padding:18px; font-size:22px; display:flex; justify-content:space-between;
    align-items:center; gap:10px;
  }
  .tren .horas{ font-weight:700; font-size:28px; }
  .tren .estaciones{ font-size:17px; color:#3a5560; margin-top:4px; }
  .tren .flecha{ font-size:26px; color:var(--azul-claro); }

  .aviso{
    background:#fff7e6; border:2px solid #e3b34d; border-radius:14px;
    padding:16px; font-size:19px; margin-top:16px;
  }
  .aviso.error{ background:#fdecec; border-color:#d9534f; }

  .boton-principal{
    display:flex; align-items:center; justify-content:center;
    width:100%; margin-top:22px; padding:20px;
    background:var(--azul); border:none; border-radius:16px; cursor:pointer;
  }
  .boton-principal svg{ width:44px; height:44px; }
  .boton-principal:focus-visible{ outline:4px solid var(--foco); }
  .boton-principal.secundario{
    background:#fff; border:3px solid var(--azul);
  }
  .boton-principal.secundario svg{ }

  .paso-titulo{ font-size:22px; font-weight:700; margin:14px 0 4px; }

  footer{ text-align:center; font-size:14px; color:#5a7079; padding:20px; }
</style>
</head>
<body>

<header>
  <h1>🚆 Horarios de tren</h1>
  <p class="subtitulo" id="subtitulo">Madrid ↔ El Herradón - La Cañada</p>
</header>

<main>

  <!-- PANTALLA 1: sentido -->
  <section class="pantalla activa" id="pantalla-sentido">
    <p class="paso-titulo">¿A dónde quieres ir?</p>
    <div class="opciones-grandes">
      <button class="opcion" data-sentido="ida" aria-label="Madrid a Cañada">
        <div class="fila-iconos">
          <svg viewBox="0 0 64 64"><!-- Oso y el Madroño (Madrid) -->
            <ellipse cx="32" cy="56" rx="22" ry="4" fill="#d8e0e3"/>
            <rect x="40" y="18" width="6" height="26" rx="3" fill="#3a7d44"/>
            <circle cx="43" cy="16" r="10" fill="#4c9a56"/>
            <circle cx="38" cy="21" r="3" fill="#c0392b"/>
            <circle cx="47" cy="12" r="3" fill="#c0392b"/>
            <circle cx="46" cy="24" r="3" fill="#c0392b"/>
            <g fill="#6b4423">
              <ellipse cx="18" cy="38" rx="14" ry="12"/>
              <circle cx="10" cy="26" r="5"/>
              <circle cx="24" cy="24" r="5.5"/>
              <rect x="8" y="46" width="6" height="10" rx="3"/>
              <rect x="22" y="46" width="6" height="10" rx="3"/>
            </g>
            <circle cx="21" cy="24" r="1.6" fill="#2b1b12"/>
          </svg>
          <svg class="flecha-direccion" viewBox="0 0 24 24" fill="none" stroke="#1c7ea6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h16M14 6l6 6-6 6"/>
          </svg>
          <svg viewBox="0 0 64 64"><!-- Cabaña con pino (Cañada) -->
            <path d="M14 30 L20 12 L26 30 Z" fill="#2f6b3e"/>
            <path d="M11 40 L20 18 L29 40 Z" fill="#3a7d44"/>
            <rect x="17" y="40" width="6" height="8" fill="#6b4423"/>
            <path d="M32 30 L46 18 L60 30 L58 30 L58 50 L34 50 L34 30 Z" fill="#8a5a34"/>
            <rect x="42" y="36" width="9" height="14" fill="#5a3a20"/>
            <rect x="36" y="34" width="6" height="6" fill="#cfe6f2"/>
          </svg>
        </div>
      </button>
      <button class="opcion" data-sentido="vuelta" aria-label="Cañada a Madrid">
        <div class="fila-iconos">
          <svg viewBox="0 0 64 64">
            <path d="M14 30 L20 12 L26 30 Z" fill="#2f6b3e"/>
            <path d="M11 40 L20 18 L29 40 Z" fill="#3a7d44"/>
            <rect x="17" y="40" width="6" height="8" fill="#6b4423"/>
            <path d="M32 30 L46 18 L60 30 L58 30 L58 50 L34 50 L34 30 Z" fill="#8a5a34"/>
            <rect x="42" y="36" width="9" height="14" fill="#5a3a20"/>
            <rect x="36" y="34" width="6" height="6" fill="#cfe6f2"/>
          </svg>
          <svg class="flecha-direccion" viewBox="0 0 24 24" fill="none" stroke="#1c7ea6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h16M14 6l6 6-6 6"/>
          </svg>
          <svg viewBox="0 0 64 64">
            <ellipse cx="32" cy="56" rx="22" ry="4" fill="#d8e0e3"/>
            <rect x="40" y="18" width="6" height="26" rx="3" fill="#3a7d44"/>
            <circle cx="43" cy="16" r="10" fill="#4c9a56"/>
            <circle cx="38" cy="21" r="3" fill="#c0392b"/>
            <circle cx="47" cy="12" r="3" fill="#c0392b"/>
            <circle cx="46" cy="24" r="3" fill="#c0392b"/>
            <g fill="#6b4423">
              <ellipse cx="18" cy="38" rx="14" ry="12"/>
              <circle cx="10" cy="26" r="5"/>
              <circle cx="24" cy="24" r="5.5"/>
              <rect x="8" y="46" width="6" height="10" rx="3"/>
              <rect x="22" y="46" width="6" height="10" rx="3"/>
            </g>
            <circle cx="21" cy="24" r="1.6" fill="#2b1b12"/>
          </svg>
        </div>
      </button>
    </div>
  </section>

  <!-- PANTALLA 2: día -->
  <section class="pantalla" id="pantalla-dia">
    <button class="volver" data-volver="pantalla-sentido" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b4f6c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12l8 8"/></svg>
    </button>
    <p class="paso-titulo">¿Qué día?</p>
    <div class="carrusel-wrapper">
      <button class="flecha-scroll izq" id="flecha-izq" aria-label="Ver días anteriores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12l8 8"/></svg>
      </button>
      <div class="carrusel-dias" id="carrusel-dias"></div>
      <button class="flecha-scroll der" id="flecha-der" aria-label="Ver días siguientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>
      </button>
    </div>
  </section>

  <!-- PANTALLA 3: franja -->
  <section class="pantalla" id="pantalla-franja">
    <button class="volver" data-volver="pantalla-dia" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b4f6c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12l8 8"/></svg>
    </button>
    <p class="paso-titulo">¿Mañana o tarde?</p>
    <div class="opciones-grandes">
      <button class="opcion" data-franja="mañana" aria-label="Mañana">
        <svg viewBox="0 0 24 24" fill="#e0a100"><circle cx="12" cy="12" r="5"/><g stroke="#e0a100" stroke-width="2"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g></svg>
      </button>
      <button class="opcion" data-franja="tarde" aria-label="Tarde">
        <svg viewBox="0 0 48 32">
          <rect x="0" y="24" width="48" height="8" fill="#3a5560"/>
          <path d="M6 24a18 18 0 0 1 36 0z" fill="#e0752a"/>
          <g stroke="#e0752a" stroke-width="2.4" stroke-linecap="round">
            <line x1="24" y1="2" x2="24" y2="7"/>
            <line x1="8" y1="9" x2="11.5" y2="12.5"/>
            <line x1="40" y1="9" x2="36.5" y2="12.5"/>
          </g>
        </svg>
      </button>
    </div>
  </section>

  <!-- PANTALLA 4: resultados -->
  <section class="pantalla" id="pantalla-resultados">
    <button class="volver" data-volver="pantalla-franja" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b4f6c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12l8 8"/></svg>
    </button>
    <p class="paso-titulo" id="titulo-resultados">Trenes</p>
    <div class="lista-trenes" id="lista-trenes"></div>
    <div id="sin-resultados" class="aviso" style="display:none">
      No hay trenes en esa franja para el día elegido. Prueba con otra franja u otro día.
    </div>
    <button class="boton-principal" id="boton-buscar-vuelta" aria-label="Buscar billete de vuelta">
      <svg viewBox="0 0 48 32" fill="none">
        <rect x="2" y="4" width="44" height="24" rx="4" fill="#fff"/>
        <line x1="30" y1="4" x2="30" y2="28" stroke="#0b4f6c" stroke-width="2" stroke-dasharray="3,3"/>
        <circle cx="30" cy="4" r="3" fill="var(--azul)"/>
        <circle cx="30" cy="28" r="3" fill="var(--azul)"/>
        <g stroke="#0b4f6c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M8 12h14M16 8l6 4-6 4"/>
          <path d="M40 20H26M32 16l-6 4 6 4"/>
        </g>
      </svg>
    </button>
    <button class="boton-principal secundario" id="boton-nueva-consulta" aria-label="Nueva consulta">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--azul)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 1 1 2.6 5.9"/>
        <path d="M4 20v-6h6"/>
      </svg>
    </button>
  </section>

</main>

<footer id="pie"></footer>

<script>
(function(){

  const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const DIAS_SEM = ["dom","lun","mar","mié","jue","vie","sáb"];

  const estado = {
    horarios: null,
    sentidoIda: true,     // true = Madrid -> Cañada (ida), false = vuelta
    fechaIda: null,
    franjaIda: null,
    esVuelta: false,      // estamos en el segundo tramo (regreso) del flujo
    fechaVuelta: null,
    franjaVuelta: null,
  };

  function pantallas() { return document.querySelectorAll(".pantalla"); }
  function mostrar(id){
    pantallas().forEach(p => p.classList.toggle("activa", p.id === id));
    window.scrollTo(0,0);
  }

  function hoyISO(offset){
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0,10);
  }

  function formateaDia(iso){
    const [y,m,d] = iso.split("-").map(Number);
    const fecha = new Date(y, m-1, d);
    return { mes: MESES[m-1], num: d, diasem: DIAS_SEM[fecha.getDay()] };
  }

  async function cargarHorarios(){
    try{
      const resp = await fetch("data/horarios.json", {cache:"no-store"});
      estado.horarios = await resp.json();
      const pie = document.getElementById("pie");
      if (estado.horarios.generado){
        const f = new Date(estado.horarios.generado);
        pie.textContent = "Horarios actualizados: " + f.toLocaleDateString("es-ES", {day:"numeric", month:"long"});
      } else {
        pie.textContent = "Aún no se han generado horarios.";
      }
    }catch(e){
      document.getElementById("pie").textContent = "No se han podido cargar los horarios.";
    }
  }

  function construyeCarruselDias(){
    const cont = document.getElementById("carrusel-dias");
    cont.innerHTML = "";
    for (let i=0; i<6; i++){
      const iso = hoyISO(i);
      const {mes, num, diasem} = formateaDia(iso);
      const btn = document.createElement("button");
      btn.className = "dia";
      btn.dataset.fecha = iso;
      btn.innerHTML = `<div class="mes">${mes}</div><div class="num">${num}</div><div class="diasem">${diasem}</div>`;
      btn.addEventListener("click", () => elegirDia(iso, btn));
      cont.appendChild(btn);
    }
  }

  document.getElementById("flecha-izq").addEventListener("click", () => {
    document.getElementById("carrusel-dias").scrollBy({left: -140, behavior: "smooth"});
  });
  document.getElementById("flecha-der").addEventListener("click", () => {
    document.getElementById("carrusel-dias").scrollBy({left: 140, behavior: "smooth"});
  });

  function elegirDia(iso, btn){
    document.querySelectorAll("#carrusel-dias .dia").forEach(d => d.classList.remove("seleccionado"));
    btn.classList.add("seleccionado");
    if (estado.esVuelta){ estado.fechaVuelta = iso; } else { estado.fechaIda = iso; }
    mostrar("pantalla-franja");
  }

  function elegirFranja(franja){
    if (estado.esVuelta){ estado.franjaVuelta = franja; } else { estado.franjaIda = franja; }
    muestraResultados();
  }

  function muestraResultados(){
    const direccion = estado.esVuelta ? !estado.sentidoIda : estado.sentidoIda;
    const clave = direccion ? "ida" : "vuelta";
    const fecha = estado.esVuelta ? estado.fechaVuelta : estado.fechaIda;
    const franja = estado.esVuelta ? estado.franjaVuelta : estado.franjaIda;

    const trenesDia = (estado.horarios && estado.horarios[clave] && estado.horarios[clave][fecha]) || [];
    const trenes = trenesDia.filter(t => t.franja === franja);

    const {mes, num, diasem} = formateaDia(fecha);
    document.getElementById("titulo-resultados").textContent =
      `${direccion ? "Madrid → Cañada" : "Cañada → Madrid"} · ${diasem} ${num} ${mes} · ${franja}`;

    const lista = document.getElementById("lista-trenes");
    lista.innerHTML = "";
    document.getElementById("sin-resultados").style.display = trenes.length ? "none" : "block";

    trenes.forEach(t => {
      const div = document.createElement("div");
      div.className = "tren";
      div.innerHTML = `
        <div>
          <div class="horas">${t.salida} <span class="flecha">→</span> ${t.llegada}</div>
          <div class="estaciones">${t.estacion_origen} → ${t.estacion_destino}</div>
        </div>`;
      lista.appendChild(div);
    });

    document.getElementById("boton-buscar-vuelta").style.display = estado.esVuelta ? "none" : "block";
    mostrar("pantalla-resultados");
  }

  function iniciaVuelta(){
    estado.esVuelta = true;
    construyeCarruselDias();
    mostrar("pantalla-dia");
  }

  function reinicia(){
    estado.sentidoIda = true;
    estado.fechaIda = null;
    estado.franjaIda = null;
    estado.esVuelta = false;
    estado.fechaVuelta = null;
    estado.franjaVuelta = null;
    document.querySelectorAll(".opcion").forEach(o => o.classList.remove("seleccionada"));
    mostrar("pantalla-sentido");
  }

  // Eventos
  document.querySelectorAll("[data-sentido]").forEach(btn=>{
    btn.addEventListener("click", () => {
      document.querySelectorAll("#pantalla-sentido .opcion").forEach(o=>o.classList.remove("seleccionada"));
      btn.classList.add("seleccionada");
      estado.sentidoIda = btn.dataset.sentido === "ida";
      estado.esVuelta = false;
      construyeCarruselDias();
      mostrar("pantalla-dia");
    });
  });

  document.querySelectorAll("[data-franja]").forEach(btn=>{
    btn.addEventListener("click", () => elegirFranja(btn.dataset.franja));
  });

  document.querySelectorAll("[data-volver]").forEach(btn=>{
    btn.addEventListener("click", () => mostrar(btn.dataset.volver));
  });

  document.getElementById("boton-buscar-vuelta").addEventListener("click", iniciaVuelta);
  document.getElementById("boton-nueva-consulta").addEventListener("click", reinicia);

  cargarHorarios();

  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
